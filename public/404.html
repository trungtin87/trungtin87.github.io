<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Không tìm thấy trang | Huyền Không Thư Quán</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #1c1e1f;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111111; color: #eeeeee; }
        .card { background: #181818; border-color: #2c2d2e; }
        .muted { color: #9a9d9e; }
        a.btn { background: #eeeeee; color: #111111; }
      }
      .card {
        max-width: 460px;
        width: 100%;
        padding: 32px;
        border: 1px solid #e6e7e6;
        border-radius: 16px;
        background: #f5f5f5;
        text-align: center;
      }
      .code { font-size: 48px; font-weight: 700; letter-spacing: -0.04em; margin: 0 0 8px; }
      h1 { font-size: 20px; margin: 0 0 10px; }
      .muted { color: #4b4f51; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
      a.btn {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #1c1e1f;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>Không tìm thấy nội dung này</h1>
      <p class="muted">Liên kết có thể đã thay đổi hoặc bài viết đã được chuyển sang địa chỉ mới trên Huyền Không Thư Quán.</p>
      <a class="btn" href="/">Quay về trang chủ</a>
    </main>
  </body>
</html>
